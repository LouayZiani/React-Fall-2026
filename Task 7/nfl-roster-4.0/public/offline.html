<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b4202e">
<title>You're offline · NFL Roster</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7ecec;color:#2b1618;font:16px/1.5 system-ui,sans-serif}
main{width:min(100%,460px);padding:32px;background:#fff;border:1px solid #e4d0d0;border-radius:18px;text-align:center;box-shadow:0 12px 36px #2b16181a}
h1{margin:0 0 12px;color:#8a1621}p{color:#6d5558}.symbol{font-size:48px}button,a{display:inline-block;margin:8px 4px;padding:12px 18px;border-radius:9px;border:2px solid #b4202e;background:#b4202e;color:white;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}
a{background:white;color:#8a1621}button:focus-visible,a:focus-visible{outline:3px solid #ffb81c;outline-offset:3px}
</style>
</head>
<body><main>
<div class="symbol" aria-hidden="true">📡</div>
<h1>You're offline</h1>
<p>NFL Roster can't reach the network right now. Previously saved public roster data may still be available when you return to the app.</p>
<p id="state" role="status">Waiting for a connection…</p>
<button id="retry" type="button">Retry connection</button>
<a href="./">Open NFL Roster</a>
</main>
<script>
const state=document.getElementById('state');
function update(){state.textContent=navigator.onLine?'Connection detected. Retry to continue.':'Waiting for a connection…';}
window.addEventListener('online',update);window.addEventListener('offline',update);
document.getElementById('retry').addEventListener('click',()=>{if(navigator.onLine)location.href='./';else{state.textContent='Still offline. Please check Wi-Fi or mobile data and try again.';}});
update();
</script></body></html>
